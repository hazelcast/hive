name: release
on:
  push:
    branches: [master]

permissions:
  # OIDC token for npm registry authentication - https://docs.npmjs.com/trusted-publishers
  id-token: write
  # push the release tag
  contents: write

jobs:
  # Runs on every push to master (which is what a merged PR produces,
  # regardless of the source branch's name or merge strategy) and only lets
  # publish_release proceed when package.json's version actually changed.
  check_version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OLD_VERSION=$(git show "$BEFORE:package.json" | jq -r .version)
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish_release:
    needs: check_version
    if: needs.check_version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Compile package
        run: npm run compile
      - name: Publish to npm
        run: npm publish --tag canary
      - name: Tag release
        id: tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git tag "v$VERSION"
          git push --no-verify origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_CORE_UI_CI }}
          webhook-type: incoming-webhook
          payload: |
            text: "📦 *@hazelcast/ui@${{ steps.tag.outputs.version }}* published to npm\n<https://www.npmjs.com/package/@hazelcast/ui/v/${{ steps.tag.outputs.version }}|View on npm> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
