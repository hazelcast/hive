name: manual release
env:
  CI: true
  GIT_AUTHOR_NAME: GitHub Actions Bot
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_AUTHOR_USERNAME: github-actions[bot]
  GIT_COMMITTER_NAME: GitHub Actions Bot
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_USERNAME: github-actions[bot]
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of the release'
        required: false
        default: 'prerelease'
        type: choice
        options:
          - major
          - minor
          - patch
          - prerelease
          - prepatch
          - preminor
          - premajor

permissions:
  # OIDC token for npm registry authentication - https://docs.npmjs.com/trusted-publishers
  id-token: write
  # `git push` changes back to repo
  contents: write

jobs:
  publish_canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Compile package
        run: npm run compile
      - name: Increment version
        run: |
          npm version --preid canary --no-commit-hooks ${{ github.event.inputs.release_type || 'prerelease' }}
          git push --no-verify
          git push --tags --no-verify
      - name: Publish to npm
        run: npm publish --tag canary
