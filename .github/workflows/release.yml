name: manual release
env:
  CI: true
  GIT_AUTHOR_NAME: GitHub Actions Bot
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_AUTHOR_USERNAME: github-actions[bot]
  GIT_COMMITTER_NAME: GitHub Actions Bot
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_USERNAME: github-actions[bot]
on:
  workflow_dispatch:
    inputs:
      skip_chromatic_publish:
        description: 'Should skip publishing to Chromatic'
        required: false
        default: false
        type: boolean
      release_type:
        description: 'Type of the release'
        required: false
        default: 'prerelease'
        type: choice
        options:
          - major
          - minor
          - patch
          - prerelease
          - prepatch
          - preminor
          - premajor
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  # OIDC token for npm registry authentication - https://docs.npmjs.com/trusted-publishers
  id-token: write
  # push the release branch/tag, create/merge the release PR
  contents: write
  pull-requests: write

jobs:
  chromatic-deployment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_chromatic_publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Compile Package
        run: npm run compile
      - name: Build Storybook
        run: npm run build-storybook
      - name: Publish to Chromatic
        uses: chromaui/action@v17
        with:
          token: ${{ github.token }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          baseBranch: master
          onlyChanged: true
          exitZeroOnChanges: true
          workingDir: ./
          autoAcceptChanges: true

  # Opens a PR bumping the version instead of pushing to master directly, since
  # master requires a PR + code owner approval. Auto-merge is enabled so it lands
  # as soon as that approval and required checks are satisfied.
  open_release_pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Bump version
        id: bump
        run: |
          VERSION=$(npm version --preid canary --no-commit-hooks --no-git-tag-version ${{ github.event.inputs.release_type || 'prerelease' }})
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="release/$VERSION"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): $VERSION"
          git push --no-verify origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(release): $VERSION" \
            --body "Automated release PR. Merging publishes \`$VERSION\` to npm under the \`canary\` tag."
          gh pr merge "$BRANCH" --auto --squash

  # Runs once the release PR above is approved and merged; publishes to npm and
  # tags the release. Tag pushes aren't gated by branch protection on master.
  publish_release:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Compile package
        run: npm run compile
      - name: Publish to npm
        run: npm publish --tag canary
      - name: Tag release
        id: tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git tag "v$VERSION"
          git push --no-verify origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_CORE_UI_CI }}
          webhook-type: incoming-webhook
          payload: |
            text: "📦 *@hazelcast/ui@${{ steps.tag.outputs.version }}* published to npm on the `canary` tag\n<https://www.npmjs.com/package/@hazelcast/ui/v/${{ steps.tag.outputs.version }}|View on npm> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
